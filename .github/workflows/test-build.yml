name: Test and build DiaDoris
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diadoris-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test packages from the official Ubuntu mirror
        run: |
          for apt_sources_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_sources_file" ]; then
              sudo sed -i -e 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' "$apt_sources_file"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg libegl1 libopengl0 libpulse0 libxkbcommon0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/fetch_ffmpeg.py
      - run: python scripts/fetch_bd3d_tools.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/test_bd3d.py
      - run: python scripts/build_windows.py
      - name: Check packaged application
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./dist/DiaDoris/DiaDoris.exe -ArgumentList @('--self-test', 'smoke.json') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged application failed its self-test' }
          $r = Get-Content smoke.json | ConvertFrom-Json
          if (-not $r.ok) { throw 'Packaged application did not validate' }
      - uses: actions/upload-artifact@v4
        with:
          name: DiaDoris-Test-Windows
          path: |
            dist/DiaDoris_*_Test_Windows_x64.zip
            dist/DiaDoris_*_Test_Windows_x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
